# /etc/systemd/system/bowery-agent.service.d/10-remote-node.conf
#
# Installed by the Bowery remote deploy kit (deploy/remote). The agent
# runs as root, and its SQLite baseline — when creating the WAL/SHM (or
# rollback journal) as root — fchown()s those aux files to match the DB
# owner. fchown is not in systemd's @system-service allow-list, so the
# fleet unit's strict SystemCallFilter SIGSYS-kills the agent at
# baseline init (systemd: code=killed, status=31/SYS; audit shows
# aarch64 syscall 55 / x86_64 syscall 93 = fchown).
#
# Re-allowing the @chown family fixes it while keeping the rest of the
# allow-list intact — far tighter than clearing the whole filter. The
# canonical fleet unit (deploy/systemd) already carries this same line;
# this drop-in guarantees it even on nodes running an older unit.
#
# The bpf + perf_event_open line does the same for the eBPF load path: on
# a BPF-LSM (KRSI) node the agent needs bpf(2) (load programs, create
# maps) and perf_event_open(2) (attach tracepoints), both in @privileged
# and thus denied by the fleet unit's `~@privileged`. Without it the agent
# SIGSYS-crashloops the moment it finds /usr/local/lib/bowery/bowery-ebpf.
# Nodes with no BPF object run NoopEventSource and never call these, so
# the allowance is harmless there.
#
# If a node still SIGSYS-dies on a *different* syscall (some exotic
# distro/arch), capture it with `journalctl -k -b | grep syscall=` and
# either add that syscall group here too, or clear the whole filter as
# a last resort with a bare `SystemCallFilter=` line.
#
# CAP_SYS_PTRACE lets the (root-but-capability-restricted) agent resolve
# OTHER processes' /proc entries — readlink /proc/<pid>/exe for exec
# enrichment, and /proc/<pid>/fd for the process_open_sockets table.
# Without it, ptrace_may_access() denies access to any process owned by a
# different uid, so exec events by non-root users never populate the
# baseline. These CapabilityBoundingSet/AmbientCapabilities lines MERGE
# with (union) the fleet unit's, so this grants it even on an older unit.

[Service]
SystemCallFilter=@chown
SystemCallFilter=bpf perf_event_open
CapabilityBoundingSet=CAP_SYS_PTRACE
AmbientCapabilities=CAP_SYS_PTRACE
