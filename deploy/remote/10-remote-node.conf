# /etc/systemd/system/bowery-agent.service.d/10-remote-node.conf
#
# Installed by the Bowery remote deploy kit (deploy/remote). The fleet
# systemd unit ships a strict SystemCallFilter allow-list that was
# validated on x86_64 BPF hosts. On some arch/systemd combinations —
# notably aarch64 Raspberry Pi OS — that allow-list rejects a syscall
# the agent makes at startup and the kernel SIGSYS-kills the process
# (systemd reports `code=killed, status=31/SYS`).
#
# A remote degraded node does not load BPF and does not enforce, so we
# clear the syscall allow-list here and keep the rest of the sandbox
# intact: ProtectSystem=strict, ProtectHome, NoNewPrivileges,
# RestrictAddressFamilies, MemoryDenyWriteExecute, RestrictNamespaces,
# and the capability bounding set all still apply.
#
# To re-enable a tuned filter later: on the node, set
#   SystemCallFilter=@system-service
#   SystemCallLog=~@system-service
# start the agent, exercise it, then read the logged syscalls from
# `journalctl -u bowery-agent | grep SystemCallLog` and add exactly
# those back. An empty assignment (below) resets the inherited list.

[Service]
SystemCallFilter=
