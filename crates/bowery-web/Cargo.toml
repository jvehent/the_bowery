[package]
name = "bowery-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Browser operator workspace for The Bowery — the console's panes plus a live mesh graph."

[dependencies]
bowery-cli = { workspace = true }
bowery-proto = { workspace = true }

anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
humantime = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "sync", "signal", "net"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
bowery-buildinfo = { workspace = true }

[lints]
workspace = true
