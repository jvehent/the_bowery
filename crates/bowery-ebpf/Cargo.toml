[package]
name = "bowery-ebpf"
description = "eBPF programs for The Bowery agent (process exec tracepoint, KRSI hooks)."
version = "0.0.1"
edition = "2021"
license = "MPL-2.0"
publish = false

[[bin]]
name = "bowery-ebpf"
path = "src/main.rs"

[dependencies]
aya-ebpf = "0.1"

# NOTE: `debug = 2` is REQUIRED, not optional. bpf-linker generates the
# object's `.BTF` section from DWARF debug info; with debug off it emits a
# BTF-less object that the agent's loader (aya: CO-RE relocations + the
# LSM `bprm_check_security` program) cannot use. This is the aya
# convention. `scripts/build-ebpf` verifies `.BTF` is present post-build.
[profile.dev]
opt-level = 3
debug = 2
overflow-checks = false
panic = "abort"

[profile.release]
opt-level = 3
debug = 2
panic = "abort"
codegen-units = 1
lto = true

# This crate compiles to the bpfel-unknown-none target with bpf-linker.
# Keep it in its OWN workspace so it doesn't inherit the parent's deny
# rules and lints (which assume hosted std). Build via:
#
#   cargo build --release --target bpfel-unknown-none -Z build-std=core
#
# scripts/build-ebpf wraps that.

[workspace]
