# Workspace cargo configuration.

[env]
# libyara (built only with `--features yara` on the agent) links OpenSSL
# by default for its `hash` module and PE-signature checks. We disable
# crypto instead of taking on an OpenSSL build/system dependency:
#
#  - it would need libssl-dev on every build host, and
#  - it's a fresh cross-compile hazard for the static aarch64-musl Pi
#    target, which is exactly the kind of toolchain yak-shave the eBPF
#    build already cost us.
#
# Consequence: YARA rules cannot use the `hash` module (md5/sha1/sha256)
# or PE signature attributes. String/byte-pattern matching — what rule
# distribution is for here — is unaffected. Agents also already expose
# file hashing separately via the `bowery_file_sha256_hex` SQL function.
YARA_CRYPTO_LIB = "disable"
